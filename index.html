<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静夜思 · John-fancy</title>
    <style>
        /* 极简风格，干净柔和 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.6;
        }

        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 2.8rem 2rem 3rem;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.08), 0 5px 12px rgba(0, 0, 0, 0.02);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* 名字样式——清晰醒目 */
        .name {
            font-size: 2.2rem;
            font-weight: 650;
            letter-spacing: 1px;
            color: #1e3c5c;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #d0e2f2;
            display: inline-block;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* 静夜思标题 */
        .poem-title {
            font-size: 1.7rem;
            font-weight: 500;
            color: #2c4a6e;
            margin-bottom: 1.8rem;
            letter-spacing: 2px;
        }

        /* 诗句容器 */
        .poem-lines {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.2rem;
        }

        .poem-line {
            font-size: 1.4rem;
            font-weight: 450;
            color: #1f3a4b;
            letter-spacing: 1.5px;
            line-height: 1.8;
            padding: 0.2rem 0;
            transition: color 0.15s;
        }

        .poem-line:hover {
            color: #0b5e7c;
        }

        /* 优雅的分隔装饰 */
        .divider {
            width: 80px;
            height: 2px;
            background: #cbdae8;
            margin: 1.2rem auto 1.8rem;
            border-radius: 4px;
        }

        /* 作者信息 —— 小而雅致 */
        .author {
            font-size: 1rem;
            color: #6f8fa8;
            letter-spacing: 2px;
            font-style: normal;
            margin-top: 0.5rem;
        }

        .author span {
            font-weight: 500;
            color: #3b5e7a;
        }

        /* 简单的响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.2rem 2.5rem;
                border-radius: 28px;
            }

            .name {
                font-size: 1.8rem;
                margin-bottom: 1.5rem;
            }

            .poem-title {
                font-size: 1.4rem;
                margin-bottom: 1.3rem;
            }

            .poem-line {
                font-size: 1.2rem;
                letter-spacing: 1px;
            }

            .author {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 你的名字 John-fancy -->
        <div class="name">John-fancy</div>

        <!-- 静夜思 诗 -->
        <div class="poem-title">静夜思</div>

        <div class="poem-lines">
            <div class="poem-line">床前明月光，</div>
            <div class="poem-line">疑是地上霜。</div>
            <div class="poem-line">举头望明月，</div>
            <div class="poem-line">低头思故乡。</div>
        </div>

        <!-- 简单的装饰线 -->
        <div class="divider"></div>

        <!-- 作者署名 -->
        <div class="author">—— <span>李白</span> ——</div>
    </div>
</body>
</html>
